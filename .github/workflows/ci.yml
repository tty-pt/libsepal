name: ci

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    uses: tty-pt/ci/.github/workflows/all-in-one.yml@main
    with:
      name: libsepal
      run_tests: true
      publish_to: "deb,apk,rpm,pacman,brew,openbsd,winget"
      deps: "libcorm,libxxhash-dev"
      deps_apk: "libcorm,xxhash-dev"
      deps_rpm: "libcorm,xxhash-devel"
      deps_pacman: "libstele,libcorm,xxhash"
      deps_brew: "libcorm,xxhash"
      deps_openbsd: "libcorm,xxhash"
      deps_winget: "mingw-w64-x86_64-xxhash"
      deps_winget_tty: "libstele,libcorm"
    secrets: inherit
